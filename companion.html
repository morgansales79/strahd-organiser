<script>
/* ===== PURSE CORE (shared by the organiser and the phone app) ===== */
var PU_DB="https://strahd-companion-default-rtdb.europe-west1.firebasedatabase.app";
var PUC=["pp","gp","sp","cp"],PUL={pp:"Platinum",gp:"Gold",sp:"Silver",cp:"Copper"},PUV={cp:1,sp:10,gp:100,pp:1000};
function puEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function puCp(p){var t=0;PUC.forEach(function(c){t+=(p[c]||0)*PUV[c]});return t}
function puGp(cp){var g=cp/100;return Math.abs(g)>=1000?Math.round(g).toLocaleString("en-GB"):String(Math.round(g*100)/100)}
function puVal(g){g=+g||0;if(g<=0)return"";if(g>=1)return(g>=1000?Math.round(g).toLocaleString("en-GB"):String(Math.round(g*100)/100))+" gp";if(g>=0.1)return Math.round(g*10)+" sp";return Math.round(g*100)+" cp"}
function puKey(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function puCoins(d){var o=[];PUC.forEach(function(c){if(d&&d[c])o.push((d[c]>0?"+":"−")+Math.abs(d[c])+" "+c)});return o.join(", ")}
function puFromGp(g){var cp=Math.round((+g||0)*100),d={gp:Math.floor(cp/100),sp:Math.floor((cp%100)/10),cp:cp%10};return d}
function puParseCost(s){var m=/([\d,]+(?:\.\d+)?)\s*(cp|sp|ep|gp|pp)\b/i.exec(String(s||""));if(!m)return 0;return parseFloat(m[1].replace(/,/g,""))*PUV[m[2].toLowerCase()]/100}
function puWhen(t){try{return new Date(t).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})}catch(e){return""}}
function puCalc(log){
 var ks=Object.keys(log||{}).sort(function(a,b){var x=log[a],y=log[b];return((x&&x.t)||0)-((y&&y.t)||0)||(a<b?-1:a>b?1:0)});
 var list=ks.filter(function(k){return log[k]&&typeof log[k]==="object"}).map(function(k){var e=Object.assign({},log[k]);e.key=k;return e}),voided={},names={};
 list.forEach(function(e){if(e.k==="void"&&e.ref)voided[e.ref]=1;if(e.k==="item"&&e.id)names[e.id]=e.name});
 var purse={cp:0,sp:0,ep:0,gp:0,pp:0},items={},order=[];
 list.forEach(function(e){if(voided[e.key]||e.k==="void")return;
  if(e.k==="coin"&&e.d){PUC.forEach(function(c){purse[c]+=Math.round(+e.d[c]||0)})}
  else if(e.k==="item"&&e.id&&e.name){items[e.id]={id:e.id,name:String(e.name),qty:Math.max(1,parseInt(e.qty,10)||1),val:+e.val||0,note:e.note||"",who:e.who||"",t:e.t,key:e.key};if(order.indexOf(e.id)<0)order.push(e.id)}
  else if(e.k==="itemx"&&items[e.ref]){var it=items[e.ref],n=e.n>0?Math.min(e.n,it.qty):it.qty;it.qty-=n;if(it.qty<=0)delete items[e.ref]}});
 var arr=order.filter(function(id){return items[id]}).map(function(id){return items[id]});
 return{purse:purse,items:arr,hist:list.slice().reverse().map(function(e){e.gone=!!voided[e.key];return e}),names:names,byKey:function(k){return list.filter(function(e){return e.key===k})[0]}}}
function puDesc(e,C){
 if(e.k==="coin")return(puCoins(e.d)||"No change")+(e.chg?" (change made)":"")+(e.note?" – "+e.note:"");
 if(e.k==="item")return"Found "+(e.qty>1?e.qty+" × ":"")+e.name+(e.val?" ("+puVal(e.val)+(e.qty>1?" each":"")+")":"")+(e.note?" – "+e.note:"");
 if(e.k==="itemx")return(e.how||"Removed")+" "+(e.n>0?e.n+" × ":"")+(C.names[e.ref]||"an item")+(e.note?" – "+e.note:"");
 if(e.k==="void"){var t=C.byKey(e.ref);return"Undid: "+(t?puDesc(t,C):"an earlier entry")}
 return"Entry"}
function puSpend(purse,sp){
 var need=puCp(sp),have=puCp(purse);
 if(need<=0)return{ok:false,err:"Enter an amount to spend."};
 if(need>have)return{ok:false,err:"The party only has "+puGp(have)+" gp in total."};
 var d={},direct=true;PUC.forEach(function(c){d[c]=-(sp[c]||0);if((purse[c]||0)+d[c]<0)direct=false});
 if(direct)return{ok:true,d:d,change:false};
 var rem=have-need,np={};
 
 np.pp=Math.min(purse.pp||0,Math.floor(rem/1000));rem-=np.pp*1000;
 np.gp=Math.floor(rem/100);rem-=np.gp*100;np.sp=Math.floor(rem/10);rem-=np.sp*10;np.cp=rem;
 PUC.forEach(function(c){d[c]=np[c]-(purse[c]||0)});return{ok:true,d:d,change:true}}
/* network */
function puUrl(code,p){return PU_DB+"/parties/"+encodeURIComponent(code)+"/"+p+".json"}
function puJ(r){return r.text().then(function(t){var j=null;try{j=JSON.parse(t)}catch(e){}if(!r.ok||(j&&typeof j==="object"&&j.error))throw new Error(r.status===401||r.status===403||(j&&/denied/i.test(j.error))?"denied":((j&&j.error)||"HTTP "+r.status));return j})}
function puGet(code,p){return fetch(puUrl(code,p),{cache:"no-store"}).then(puJ)}
function puPut(code,p,v){return fetch(puUrl(code,p),{method:"PUT",body:JSON.stringify(v)}).then(puJ)}
function puNewCode(){var a=new Uint8Array(16),s="";(window.crypto||window.msCrypto).getRandomValues(a);for(var i=0;i<16;i++)s+="abcdefghjkmnpqrstuvwxyz23456789".charAt(a[i]%31);return s}
var PUCSS='.puw{display:flex;flex-direction:column;gap:12px}.putabs{display:flex;gap:6px}.putabs button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:600;cursor:pointer}.putabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}'+

'#puov{display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:12px}.pubox{background:var(--panel);color:var(--text);border:2px solid var(--acc);border-radius:14px;padding:16px;width:min(520px,100%);max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}.pubox h3{margin:0}.pubox label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}.pubox input,.pubox select{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px;min-height:44px}.pucg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pucg input{padding:11px 4px;text-align:center}'+
'.pucl{max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--field)}.pucl button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:11px 10px;font:inherit;cursor:pointer}.pucl button span+span{color:var(--mute);font-size:.8rem;text-align:right}.pucl .pucu{color:var(--acc2);font-weight:600}.puchips{display:flex;gap:6px;flex-wrap:wrap}.puchips button{flex:1;min-width:70px;padding:10px 6px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;cursor:pointer}.puchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}';
function puMake(cfg){
 var P={tab:"purse",log:{},queue:[],status:"",last:0,m:null,seen:0,flushing:false,syncing:false,err:""};
 function g(k){try{return cfg.store.get(k)}catch(e){return null}}function s(k,v){try{cfg.store.set(k,v)}catch(e){}}
 function load(){P.log={};P.queue=[];P.seen=0;try{var c=JSON.parse(g("cache")||"{}");if(c.code===cfg.code()){P.log=c.log||{};P.seen=c.seen||0}var q=JSON.parse(g("queue")||"[]");P.queue=(q||[]).filter(function(x){return x.code===cfg.code()})}catch(e){}}
 function save(){s("cache",JSON.stringify({code:cfg.code(),log:P.log,seen:P.seen}));s("queue",JSON.stringify(P.queue))}
 function full(){var L={};Object.keys(P.log).forEach(function(k){L[k]=P.log[k]});P.queue.forEach(function(q){L[q.key]=q.e});return L}
 function calc(){return puCalc(full())}
 function setSt(t,bad){P.status=t;P.bad=!!bad;var el=document.getElementById("pust");if(el){el.textContent=t;el.className="pumute"+(bad?" pubad":"")}}
 function stTxt(){return P.err?P.err+(P.queue.length?" "+P.queue.length+" change"+(P.queue.length>1?"s are":" is")+" saved here and will send when it's back.":""):(P.queue.length?"Offline: "+P.queue.length+" change"+(P.queue.length>1?"s":"")+" waiting to send":P.last?"Live · updated "+new Date(P.last).toLocaleTimeString("en-GB"):"Connecting…")}
 function errMsg(e){return e&&e.message==="denied"?"The database refused access. Check the security rules are published.":"Can't reach the database right now."}

 function flush(){if(P.flushing||!P.queue.length||!cfg.code())return Promise.resolve();P.flushing=true;
  var step=function(){var q=P.queue[0];if(!q){P.flushing=false;return Promise.resolve()}
   return puPut(q.code,"log/"+q.key,q.e).then(function(){P.log[q.key]=q.e;P.queue.shift();save();P.err="";return step()},function(e){P.flushing=false;P.err=P.queue.length&&e&&e.message==="denied"?errMsg(e):"";setSt(e&&e.message==="denied"?errMsg(e):stTxt(),e&&e.message==="denied");throw e})};
  return step().catch(function(){})}
 function sync(){if(!cfg.code())return Promise.resolve();if(P.syncing)return Promise.resolve();P.syncing=true;
  return flush().then(function(){return puGet(cfg.code(),"log")}).then(function(j){var before=JSON.stringify(P.log);P.log=j&&typeof j==="object"?j:{};P.err="";P.last=Date.now();var changed=JSON.stringify(P.log)!==before;save();P.syncing=false;if(changed){draw();if(cfg.onData)cfg.onData()}else setSt(stTxt())},function(e){P.syncing=false;P.err=errMsg(e);setSt(P.err,true)})}
 function add(e){e.t=Date.now();e.who=cfg.who();var key=puKey();P.queue.push({key:key,e:e,code:cfg.code()});save();draw();if(cfg.onData)cfg.onData();return flush().then(function(){draw();return sync()})}
 function html(){
  var C=calc(),cp=puCp(C.purse),iv=0;C.items.forEach(function(i){iv+=i.val*i.qty});var h='<div class="puw"><div class="putabs">'+[["purse","Purse"],["items","Items ("+C.items.length+")"],["hist","History"]].map(function(t){return'<button data-pu="tab" data-v="'+t[0]+'" class="'+(P.tab===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</div>';
  if(P.tab==="purse"){h+='<div class="pucard"><div class="pumute">Party purse, worth about</div><div class="pubig">'+puGp(cp)+' gp</div><div class="pucoins">'+PUC.map(function(c){return'<div class="pucoin"><b>'+C.purse[c]+'</b><span>'+c+'</span></div>'}).join("")+'</div><div class="purow"><button class="pub" data-pu="coin" data-m="add">Add coins</button><button class="pub2" data-pu="coin" data-m="spend">Spend coins</button><button class="pub2" data-pu="ex">Change coins</button></div></div>'+
   '<div class="pucard"><div><b>'+C.items.length+'</b> treasure item'+(C.items.length===1?"":"s")+(iv?' worth about <b>'+puGp(iv*100)+' gp</b>':'')+'</div><div class="purow"><button class="pub2" data-pu="tab" data-v="items">View items</button><button class="pub" data-pu="item">Add item</button></div></div>'}
  else if(P.tab==="items"){h+='<div class="purow"><button class="pub" data-pu="item">Add item</button></div><div class="pucard">'+(C.items.length?C.items.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(i){return'<div class="puit"><div><b>'+puEsc(i.name)+'</b>'+(i.qty>1?' × '+i.qty:'')+'<div class="pumute">'+(i.val?puVal(i.val)+(i.qty>1?' each':''):'No value set')+(i.who?' · added by '+puEsc(i.who):'')+'</div>'+(i.note?'<div class="pumute">'+puEsc(i.note)+'</div>':'')+'</div><button class="pub2" style="flex:none;min-height:40px;padding:8px 12px" data-pu="rm" data-id="'+puEsc(i.id)+'">Sell / use</button></div>'}).join(""):'<div class="pumute">No treasure items yet.</div>')+'</div>'}
  else{h+='<div class="pucard">'+(C.hist.length?C.hist.slice(0,300).map(function(e){return'<div class="puhi'+(e.gone?" gone":"")+'"><div class="pumute">'+puWhen(e.t)+' · '+puEsc(e.who||"")+(e.gone?' · undone':'')+(P.queue.some(function(q){return q.key===e.key})?' · waiting to send':'')+'</div><div class="pud">'+puEsc(puDesc(e,C))+'</div>'+(e.k!=="void"&&!e.gone?'<button class="pub2" style="min-height:36px;padding:6px 12px;margin-top:6px" data-pu="undo" data-k="'+puEsc(e.key)+'">Undo</button>':'')+'</div>'}).join(""):'<div class="pumute">Nothing logged yet.</div>')+'</div>'}
  return h+'</div>'}
 function ov(){var el=document.getElementById("puov");if(!el){el=document.createElement("div");el.id="puov";document.body.appendChild(el)}return el}
 function show(inner){var el=ov();el.innerHTML='<div class="pubox" role="dialog">'+inner+'</div>';el.style.display="flex"}
 function hide(){var el=document.getElementById("puov");if(el)el.style.display="none";P.m=null}
 function ci(c){return'<label>'+c.toUpperCase()+'<input type="number" enterkeyhint="done" inputmode="numeric" min="0" step="1" data-pc="'+c+'" placeholder="0"></label>'}
 function coinModal(m){P.m={t:"coin",m:m};show('<h3>'+(m==="add"?"Add coins":"Spend coins")+'</h3><div class="pucg">'+PUC.map(ci).join("")+'</div><div class="pumute" id="pupv"></div><label>Note (optional)<input type="text" id="punote" maxlength="80" placeholder="'+(m==="add"?"e.g. looted from the crypt":"e.g. rooms at the inn")+'"></label><div class="pubad" id="puerr"></div><div class="purow"><button class="pub" data-pu="ok">'+(m==="add"?"Add to purse":"Spend")+'</button><button class="pub2" data-pu="x">Cancel</button></div>')}
 function cat(){var seen={},out=[];(cfg.items()||[]).forEach(function(i){var k=i.n.toLowerCase();if(!seen[k]){seen[k]=1;out.push(i)}});var C=calc();C.items.forEach(function(i){var k=i.name.toLowerCase();if(!seen[k]){seen[k]=1;out.push({n:i.name,c:"Custom",gp:i.val})}});Object.keys(C.names).forEach(function(id){var k=String(C.names[id]).toLowerCase();if(!seen[k]){seen[k]=1;out.push({n:C.names[id],c:"Custom",gp:0})}});return out.sort(function(a,b){return a.n.localeCompare(b.n)})}
 function itemModal(){P.m={t:"item",cat:cat()};show('<h3>Add treasure item</h3><label>Item (search the list or type your own)<input type="text" id="puq" autocomplete="off" placeholder="Search…" maxlength="80"></label><div class="pucl" id="pucl"></div><div class="purow"><label>Quantity<input type="number" enterkeyhint="done" inputmode="numeric" min="1" step="1" id="puqty" value="1"></label><label>Value each (gp)<input type="number" enterkeyhint="done" inputmode="decimal" min="0" step="any" id="puval" placeholder="0"></label></div><label>Note (optional)<input type="text" id="punote" maxlength="120" placeholder="e.g. found in the wine cellar"></label><div class="pubad" id="puerr"></div><div class="purow"><button class="pub" data-pu="ok">Add item</button><button class="pub2" data-pu="x">Cancel</button></div>');combo()}
 function combo(){var q=document.getElementById("puq"),l=document.getElementById("pucl");if(!q||!l||!P.m)return;var s=q.value.trim().toLowerCase(),a=P.m.cat,m=s?a.filter(function(i){return i.n.toLowerCase().indexOf(s)>-1}):a,exact=a.some(function(i){return i.n.toLowerCase()===s}),h="";
  if(s&&!exact)h+='<button type="button" class="pucu" data-pu="pick" data-i="-1"><span>Use “'+puEsc(q.value.trim())+'” as a custom item</span></button>';

  if(f===t)return{err:"Choose two different coin types."};if(a<=0)return{err:"Enter how many coins to change."};if(a>pu[f])return{err:"The party only has "+pu[f]+" "+f+"."};
