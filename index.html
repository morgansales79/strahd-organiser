<style>
:root{--bg:#16121a;--panel:#201a26;--line:#3a2f43;--text:#e8e2d6;--mute:#9a91a6;--acc:#c0334d;--acc2:#7e8db0;--field:#120f16;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ecebf1;--panel:#fafafc;--line:#cfcbd9;--text:#1d1822;--mute:#5f5869;--acc:#a3203a;--acc2:#4b5b82;--field:#fff}}
:root[data-theme="light"]{--bg:#ecebf1;--panel:#fafafc;--line:#cfcbd9;--text:#1d1822;--mute:#5f5869;--acc:#a3203a;--acc2:#4b5b82;--field:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Roboto,"Noto Sans","Droid Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:inherit;font-weight:700;margin:0}
h1{font-size:2rem}h2{font-size:1.6rem}h3{font-size:1.2rem}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
header p{margin:0;color:var(--mute);font-size:.85rem}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:190px 1fr;gap:20px;padding:20px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{text-align:left;padding:10px 14px;border-radius:8px;border:1px solid transparent;background:var(--panel);color:var(--text);cursor:pointer;font:inherit}
nav button.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
button,.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-height:40px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button:hover{border-color:var(--acc2)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.del{color:var(--acc);padding:4px 10px}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--mute)}
label.f input,label.f select,label.f textarea{margin-top:3px;color:var(--text);font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{font-family:inherit;font-weight:700;font-size:2.2rem;line-height:1;color:var(--acc)}
.mute{color:var(--mute);font-size:.85rem}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}.chk input{width:22px;height:22px;flex:none}
.chk.done span{text-decoration:line-through;color:var(--mute)}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}.pc{border-top:3px solid var(--acc)}.phead{display:flex;flex-direction:column;gap:6px}.pname{font-size:1.3rem;font-weight:700;background:transparent;border-color:transparent;padding:4px 6px}.pname:focus{background:var(--field);border-color:var(--line)}.psub{display:grid;grid-template-columns:1fr 1.4fr 70px;gap:6px}.pbg{font-size:.9rem}.tiles{display:grid;gap:8px}.t5{grid-template-columns:repeat(5,1fr)}.t6{grid-template-columns:repeat(6,1fr)}.tile{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:6px 4px;min-width:0}.tile .tl{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:center}.tile input{text-align:center;font-size:1.15rem;font-weight:700;border:none;background:transparent;padding:4px 0;width:100%;min-width:0}.tile .mod{font-size:.8rem;color:var(--acc2);font-weight:700;min-height:1.1em}details summary{cursor:pointer;padding:6px 0}@media(max-width:520px){.t5{grid-template-columns:repeat(3,1fr)}.t6{grid-template-columns:repeat(3,1fr)}}
.cb{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}.cb.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.cb.down{opacity:.6}.cinit{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:4px}.cinit input{text-align:center;font-size:1.6rem;font-weight:800;border:none;background:transparent;padding:2px;width:100%}.tl{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}.cbody{display:flex;flex-direction:column;gap:8px;min-width:0}.cname{font-weight:700;font-size:1.05rem;flex:1;min-width:140px}.hpline{display:flex;gap:8px;align-items:flex-end}.hpf{display:flex;flex-direction:column;width:84px}.hpf input{text-align:center;font-weight:700}.bar{height:10px;background:var(--field);border:1px solid var(--line);border-radius:6px;overflow:hidden}.bar div{height:100%;transition:width .2s}.hpctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hpctl input{width:80px;text-align:center}.pill.now{background:var(--acc);color:#fff;border-color:var(--acc)}.pill.dn{border-color:#c0334d;color:#c0334d}.pill.big{font-size:1rem;padding:6px 14px;color:var(--text)}.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.addrow select{flex:1;min-width:200px}.addrow input[type=number]{width:80px}.sbx{white-space:pre-wrap;font:13px/1.45 inherit;margin:6px 0 0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto}@media(max-width:520px){.cb{grid-template-columns:1fr}}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:8px;align-items:start}.clist>.mute{grid-column:1/-1}.clist .cb{margin:0;padding:6px 8px;gap:8px;grid-template-columns:56px 1fr}.cinit input{font-size:1.3rem}.cl1{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}.cl1 .cname{min-width:0;padding:6px 8px}.cl1 .del{min-height:32px;padding:2px 8px;font-size:.8rem}.cl2{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}.cl2 button{min-height:36px;padding:4px 10px}.cl2 .amt{width:104px;padding:6px 6px}.cl2 .plus{min-width:36px;padding:4px 8px}.atot{font-weight:700;color:var(--acc2);min-width:34px}.hpf{width:56px}.hpf input{padding:6px 2px}.cbody{gap:5px}.bar{height:6px}.addp{padding:8px 12px;gap:6px;margin-bottom:10px!important}.addp details{margin:0}.addp summary{padding:2px 0;font-size:.85rem}@media(max-width:520px){.clist{grid-template-columns:1fr}.clist .cb{grid-template-columns:56px 1fr}}
.clist{display:block!important}.clist .cb{margin:0 0 6px;padding:4px 8px;align-items:center}.cbody{flex-direction:row!important;flex-wrap:wrap;align-items:center;gap:4px 10px!important}.cl1{flex:1 1 220px}.cl2{flex:0 0 auto;align-items:center!important}.hpf{width:auto!important;flex-direction:row!important;align-items:center;gap:3px}.hpf input{width:46px!important}.bar{order:5;flex:0 0 100%;height:4px!important}.cbody details{order:6;flex:0 0 100%}.cinit{padding:0!important}.cinit .tl{display:none}.cinit input{font-size:1.2rem!important}@media(max-width:520px){.cl2{flex:1 1 100%}}
.calcfab{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);min-height:48px;padding:8px 18px}.calc{position:fixed;right:16px;bottom:16px;z-index:60;width:min(340px,calc(100vw - 32px));background:var(--panel);border:2px solid var(--acc);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.5)}.chead{display:flex;justify-content:space-between;align-items:center}.crow{display:flex;gap:8px}.crow input{flex:1;font-size:1.2rem}.ctot{font-size:1.4rem}.ctot b{color:var(--acc2)}.cdisp{font-size:1.4rem;font-weight:700;text-align:right}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kp button{min-height:54px;font-size:1.4rem;font-weight:700;justify-content:center}.kp .kfn{color:var(--acc2)}.kp .k0{grid-column:span 3}

["Zombie","Castle Ravenloft","AC 8, HP 22, CR 1/4","Medium undead, neutral evil\nAC 8 | HP 22 (3d8 + 9) | Speed 20 ft.\nSTR 13 (+1) DEX 6 (-2) CON 16 (+3) INT 3 (-4) WIS 6 (-2) CHA 5 (-3)\nSaving Throws WIS +0\nDamage Immunities poison | Condition Immunities poisoned\nSenses darkvision 60 ft., passive Perception 8\nLanguages understands the languages it knew in life but can't speak\nChallenge 1/4 (50 XP)\n\nTRAITS\nUndead Fortitude. If damage reduces it to 0 HP, it makes a CON save (DC 5 + damage taken) unless the damage is radiant or from a critical hit. On a success it drops to 1 HP instead.\n\nACTIONS\nSlam. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d6 + 1) bludgeoning damage."],
["Skeleton","Castle Ravenloft","AC 13, HP 13, CR 1/4","Medium undead, lawful evil\nAC 13 (armor scraps) | HP 13 (2d8 + 4) | Speed 30 ft.\nSTR 10 (+0) DEX 14 (+2) CON 15 (+2) INT 6 (-2) WIS 8 (-1) CHA 5 (-3)\nDamage Vulnerabilities bludgeoning\nDamage Immunities poison | Condition Immunities exhaustion, poisoned\nSenses darkvision 60 ft., passive Perception 9\nLanguages understands the languages it knew in life but can't speak\nChallenge 1/4 (50 XP)\n\nACTIONS\nShortsword. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) piercing damage.\nShortbow. Ranged Weapon Attack: +4 to hit, range 80/320 ft., one target. Hit: 5 (1d6 + 2) piercing damage."],
["Ghoul","Roaming / Other","AC 12, HP 22, CR 1","Medium undead, chaotic evil\nAC 12 | HP 22 (5d8) | Speed 30 ft.\nSTR 13 (+1) DEX 15 (+2) CON 10 (+0) INT 7 (-2) WIS 10 (+0) CHA 6 (-2)\nDamage Immunities poison | Condition Immunities charmed, exhaustion, poisoned\nSenses darkvision 60 ft., passive Perception 10\nLanguages Common\nChallenge 1 (200 XP)\n\nACTIONS\nBite. Melee Weapon Attack: +2 to hit, reach 5 ft., one creature. Hit: 9 (2d6 + 2) piercing damage.\nClaws. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 7 (2d4 + 2) slashing damage. If the target is a creature other than an elf or undead, it must succeed on a DC 10 CON save or be paralyzed for 1 minute. It can repeat the save at the end of each of its turns, ending the effect on a success."],
["Ghast","Roaming / Other","AC 13, HP 36, CR 2","Medium undead, chaotic evil\nAC 13 | HP 36 (8d8) | Speed 30 ft.\nSTR 16 (+3) DEX 17 (+3) CON 10 (+0) INT 11 (+0) WIS 10 (+0) CHA 8 (-1)\nDamage Resistances necrotic | Damage Immunities poison\nCondition Immunities charmed, exhaustion, poisoned\nSenses darkvision 60 ft., passive Perception 10\nLanguages Common\nChallenge 2 (450 XP)\n\nTRAITS\nStench. Any creature that starts its turn within 5 ft. of the ghast must succeed on a DC 10 CON save or be poisoned until the start of its next turn. On a success it is immune to the stench for 24 hours.\nTurn Defiance. The ghast and any ghouls within 30 ft. have advantage on saving throws against effects that turn undead.\n\nACTIONS\nBite. Melee Weapon Attack: +3 to hit, reach 5 ft., one creature. Hit: 12 (2d8 + 3) piercing damage.\nClaws. Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) slashing damage. If the target is a creature other than an elf or undead, it must succeed on a DC 10 CON save or be paralyzed for 1 minute (repeat save at the end of each of its turns)."],
["Wolf","Roaming / Other","AC 13, HP 11, CR 1/4","Medium beast, unaligned\nAC 13 (natural armor) | HP 11 (2d8 + 2) | Speed 40 ft.\nSTR 12 (+1) DEX 15 (+2) CON 12 (+1) INT 3 (-4) WIS 12 (+1) CHA 6 (-2)\nSkills Perception +3, Stealth +4\nSenses passive Perception 13\nChallenge 1/4 (50 XP)\n\nTRAITS\nKeen Hearing and Smell. Advantage on Perception checks that rely on hearing or smell.\nPack Tactics. Advantage on an attack roll against a creature if at least one of the wolf's allies is within 5 ft. of the creature and isn't incapacitated.\n\nACTIONS\nBite. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 7 (2d4 + 2) piercing damage. If the target is a creature, it must succeed on a DC 11 STR save or be knocked prone."],
["Dire wolf","Roaming / Other","AC 14, HP 37, CR 1","Large beast, unaligned\nAC 14 (natural armor) | HP 37 (5d10 + 10) | Speed 50 ft.\nSTR 17 (+3) DEX 15 (+2) CON 15 (+2) INT 3 (-4) WIS 12 (+1) CHA 7 (-2)\nSkills Perception +3, Stealth +4\nSenses passive Perception 13\nChallenge 1 (200 XP)\n\nTRAITS\nKeen Hearing and Smell. Advantage on Perception checks that rely on hearing or smell.\nPack Tactics. Advantage on an attack roll against a creature if at least one of the wolf's allies is within 5 ft. of the creature and isn't incapacitated.\n\nACTIONS\nBite. Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) piercing damage. If the target is a creature, it must succeed on a DC 13 STR save or be knocked prone."],
["Werewolf","Werewolf Den","AC 11 (humanoid) or 12 (wolf), HP 58, CR 3","Medium humanoid (human, shapechanger), chaotic evil\nAC 11 in humanoid form, 12 (natural armor) in wolf or hybrid form | HP 58 (9d8 + 18) | Speed 30 ft. (40 ft. in wolf form)\nSTR 15 (+2) DEX 13 (+1) CON 14 (+2) INT 10 (+0) WIS 11 (+0) CHA 10 (+0)\nSkills Perception +4, Stealth +3\nDamage Immunities bludgeoning, piercing and slashing from nonmagical attacks not made with silvered weapons\nSenses passive Perception 14\nLanguages Common (can't speak in wolf form)\nChallenge 3 (700 XP)\n\nTRAITS\nShapechanger. Can use its action to polymorph into a wolf-humanoid hybrid or a wolf, or back into its true form (humanoid). Its statistics, other than AC, are the same in each form. Carried equipment isn't transformed. Reverts to true form if it dies.\nKeen Hearing and Smell. Advantage on Perception checks that rely on hearing or smell.\n\nACTIONS\nMultiattack (Humanoid or Hybrid Form Only). Two attacks: two with its spear (humanoid form) or one with its bite and one with its claws (hybrid form).\nBite (Wolf or Hybrid Form Only). Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8 + 2) piercing damage. If the target is a humanoid, it must succeed on a DC 12 CON save or be cursed with werewolf lycanthropy.\nClaws (Hybrid Form Only). Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 7 (2d4 + 2) slashing damage.\nSpear (Humanoid Form Only). Melee or Ranged Weapon Attack: +4 to hit, reach 5 ft. or range 20/60 ft., one creature. Hit: 5 (1d6 + 2) piercing damage, or 6 (1d8 + 2) if used with two hands to make a melee attack."],
["Wereraven","Village of Barovia","AC 12, HP 31, CR 2","Medium humanoid (human, shapechanger)\nAC 12 | HP 31 (7d8) | Speed 30 ft. in humanoid form; 10 ft., fly 50 ft. in raven form; 30 ft., fly 50 ft. in hybrid form\nSTR 10 (+0) DEX 15 (+2) CON 11 (+0) INT 13 (+1) WIS 15 (+2) CHA 14 (+2)\nSkills Insight +4, Perception +6\nSenses passive Perception 16\nLanguages Common (can't speak in raven form)\nChallenge 2 (450 XP) | Proficiency Bonus +2\n\nTRAITS\nMimicry. Can mimic simple sounds it has heard, such as a person whispering, a baby crying or an animal chattering. A creature that hears the sounds can tell they are imitations with a successful DC 10 WIS (Insight) check.\nRegeneration. Regains 10 hit points at the start of its turn. If it takes damage from a silvered weapon or a spell, this trait doesn't function at the start of its next turn. It dies only if it starts its turn with 0 hit points and doesn't regenerate.\n\nACTIONS\nMultiattack (Human or Hybrid Form Only). Two weapon attacks, one of which can be with its hand crossbow.\nBeak (Raven or Hybrid Form Only). Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 1 piercing damage in raven form, or 4 (1d4 + 2) piercing damage in hybrid form. If the target is a humanoid, it must succeed on a DC 10 CON save or be cursed with wereraven lycanthropy.\nShortsword (Humanoid or Hybrid Form Only). Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) piercing damage.\nHand Crossbow (Humanoid or Hybrid Form Only). Ranged Weapon Attack: +4 to hit, range 30/120 ft., one target. Hit: 5 (1d6 + 2) piercing damage.\nChange Shape. Polymorphs into a raven-humanoid hybrid or into a raven, or back into its humanoid form. Its statistics, other than its size and speed, are the same in each form. Any equipment it is wearing or carrying isn't transformed. It reverts to its humanoid form if it dies."],
["Swarm of bats","Castle Ravenloft","AC 12, HP 22, CR 1/4","Medium swarm of Tiny beasts, unaligned\nAC 12 | HP 22 (5d8) | Speed 0 ft., fly 30 ft.\nSTR 5 (-3) DEX 15 (+2) CON 10 (+0) INT 2 (-4) WIS 12 (+1) CHA 4 (-3)\nDamage Resistances bludgeoning, piercing, slashing\nCondition Immunities charmed, frightened, grappled, paralyzed, petrified, prone, restrained, stunned\nSenses blindsight 60 ft., passive Perception 11\nChallenge 1/4 (50 XP)\n\nTRAITS\nEcholocation. Can't use its blindsight while deafened.\nKeen Hearing. Advantage on Perception checks that rely on hearing.\nSwarm. Can occupy another creature's space and vice versa, and can move through any opening large enough for a Tiny bat. Can't regain hit points or gain temporary hit points.\n\nACTIONS\nBites. Melee Weapon Attack: +4 to hit, reach 0 ft., one creature in the swarm's space. Hit: 5 (2d4) piercing damage, or 2 (1d4) if the swarm has half its hit points or fewer."],
["Swarm of ravens","Roaming / Other","AC 12, HP 24, CR 1/4","Medium swarm of Tiny beasts, unaligned\nAC 12 | HP 24 (7d8 - 7) | Speed 10 ft., fly 50 ft.\nSTR 6 (-2) DEX 14 (+2) CON 8 (-1) INT 3 (-4) WIS 12 (+1) CHA 6 (-2)\nSkills Perception +5\nDamage Resistances bludgeoning, piercing, slashing\nCondition Immunities charmed, frightened, grappled, paralyzed, petrified, prone, restrained, stunned\nSenses passive Perception 15\nChallenge 1/4 (50 XP)\n\nTRAITS\nSwarm. Can occupy another creature's space and vice versa, and can move through any opening large enough for a Tiny raven. Can't regain hit points or gain temporary hit points.\n\nACTIONS\nBeaks. Melee Weapon Attack: +4 to hit, reach 0 ft., one creature in the swarm's space. Hit: 7 (2d6) piercing damage, or 3 (1d6) if the swarm has half its hit points or fewer."],
["Vampire spawn","Castle Ravenloft","AC 15, HP 82, CR 5","Medium undead, neutral evil\nAC 15 (natural armor) | HP 82 (11d8 + 33) | Speed 30 ft.\nSTR 16 (+3) DEX 16 (+3) CON 16 (+3) INT 11 (+0) WIS 10 (+0) CHA 12 (+1)\nSaving Throws DEX +6, WIS +3\nSkills Perception +3, Stealth +6\nDamage Resistances necrotic; bludgeoning, piercing and slashing from nonmagical attacks\nSenses darkvision 60 ft., passive Perception 13\nLanguages the languages it knew in life\nChallenge 5 (1,800 XP)\n\nTRAITS\nRegeneration. Regains 10 HP at the start of its turn if it has at least 1 HP and isn't in sunlight or running water. If it takes radiant damage or damage from holy water, this doesn't function at the start of its next turn.\nSpider Climb. Can climb difficult surfaces, including ceilings, without ability checks.\nVampire Weaknesses.\n- Forbiddance: can't enter a residence without an invitation from an occupant.\n- Harmed by Running Water: takes 20 acid damage if it ends its turn in running water.\n- Stake to the Heart: if a piercing weapon made of wood is driven into its heart while it is incapacitated in its resting place, it is paralyzed until the stake is removed.\n- Sunlight Hypersensitivity: takes 20 radiant damage when it starts its turn in sunlight. While in sunlight it has disadvantage on attack rolls and ability checks.\n\nACTIONS\nMultiattack. Two attacks, only one of which can be a bite.\nClaws. Melee Weapon Attack: +6 to hit, reach 5 ft., one creature. Hit: 8 (2d4 + 3) slashing damage. Instead of dealing damage, it can grapple the target (escape DC 13).\nBite. Melee Weapon Attack: +6 to hit, reach 5 ft., one willing creature, or a creature that is grappled by it, incapacitated or restrained. Hit: 6 (1d6 + 3) piercing damage plus 7 (2d6) necrotic damage. The target's hit point maximum is reduced by the necrotic damage taken, and the spawn regains HP equal to that amount. The reduction lasts until the target finishes a long rest. The target dies if its hit point maximum drops to 0."],
["Gargoyle","Castle Ravenloft","AC 15, HP 52, CR 2","Medium elemental, chaotic evil\nAC 15 (natural armor) | HP 52 (7d8 + 21) | Speed 30 ft., fly 60 ft.\nSTR 15 (+2) DEX 11 (+0) CON 16 (+3) INT 6 (-2) WIS 11 (+0) CHA 7 (-2)\nDamage Resistances bludgeoning, piercing and slashing from nonmagical attacks that aren't adamantine\nDamage Immunities poison | Condition Immunities exhaustion, petrified, poisoned\nSenses darkvision 60 ft., passive Perception 10\nLanguages Terran\nChallenge 2 (450 XP)\n\nTRAITS\nFalse Appearance. While motionless, it is indistinguishable from an inanimate statue.\n\nACTIONS\nMultiattack. Two attacks: one with its bite and one with its claws.\nBite. Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 5 (1d6 + 2) piercing damage.\nClaws. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8 + 2) slashing damage."],
["Wight","Roaming / Other","AC 14, HP 45, CR 3","Medium undead, neutral evil\nAC 14 (studded leather) | HP 45 (6d8 + 18) | Speed 30 ft.\nSTR 15 (+2) DEX 14 (+2) CON 16 (+3) INT 10 (+0) WIS 13 (+1) CHA 15 (+2)\nSkills Perception +3, Stealth +4\nDamage Resistances necrotic; bludgeoning, piercing and slashing from nonmagical attacks that aren't silvered\nDamage Immunities poison | Condition Immunities exhaustion, poisoned\nSenses darkvision 60 ft., passive Perception 13\nLanguages the languages it knew in life\nChallenge 3 (700 XP)\n\nTRAITS\nSunlight Sensitivity. Disadvantage on attack rolls, and on Perception checks that rely on sight, while in sunlight.\n\nACTIONS\nMultiattack. Two longsword attacks or two longbow attacks. It can use Life Drain in place of one longsword attack.\nLife Drain. Melee Weapon Attack: +4 to hit, reach 5 ft., one creature. Hit: 5 (1d6 + 2) necrotic damage. The target must succeed on a DC 13 CON save or its hit point maximum is reduced by the damage taken, until it finishes a long rest. The target dies if this reduces its maximum to 0. A humanoid slain by this attack rises 24 hours later as a zombie under the wight's control, unless the humanoid is restored to life or its body destroyed. The wight can have no more than twelve zombies under its control at one time.\nLongsword. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 6 (1d8 + 2) slashing damage, or 7 (1d10 + 2) if used with two hands.\nLongbow. Ranged Weapon Attack: +4 to hit, range 150/600 ft., one target. Hit: 6 (1d8 + 2) piercing damage."],
["Wraith","Roaming / Other","AC 13, HP 67, CR 5","Medium undead, neutral evil\nAC 13 | HP 67 (9d8 + 27) | Speed 0 ft., fly 60 ft. (hover)\nSTR 6 (-2) DEX 16 (+3) CON 16 (+3) INT 12 (+1) WIS 14 (+2) CHA 15 (+2)\nDamage Resistances acid, cold, fire, lightning, thunder; bludgeoning, piercing and slashing from nonmagical attacks that aren't silvered\nDamage Immunities necrotic, poison\nCondition Immunities charmed, exhaustion, grappled, paralyzed, petrified, poisoned, prone, restrained\nSenses darkvision 60 ft., passive Perception 12\nLanguages the languages it knew in life\nChallenge 5 (1,800 XP)\n\nTRAITS\nIncorporeal Movement. Can move through creatures and objects as if difficult terrain. Takes 5 (1d10) force damage if it ends its turn inside an object.\nSunlight Sensitivity. Disadvantage on attack rolls, and on Perception checks that rely on sight, while in sunlight.\n\nACTIONS\nLife Drain. Melee Weapon Attack: +6 to hit, reach 5 ft., one creature. Hit: 21 (4d8 + 3) necrotic damage. The target must succeed on a DC 14 CON save or its hit point maximum is reduced by the damage taken, until it finishes a long rest. The target dies if this reduces its maximum to 0.\nCreate Specter. Targets a humanoid within 10 ft. that has been dead no longer than 1 minute and died violently. The target's spirit rises as a specter in the space of its corpse or the nearest unoccupied space. The specter is under the wraith's control. The wraith can have no more than seven specters under its control at one time."],
["Banshee","Argynvostholt","AC 12, HP 58, CR 4","Medium undead, chaotic evil\nAC 12 | HP 58 (13d8) | Speed 0 ft., fly 40 ft. (hover)\nSTR 1 (-5) DEX 14 (+2) CON 10 (+0) INT 12 (+1) WIS 11 (+0) CHA 17 (+3)\nSaving Throws WIS +2, CHA +5\nDamage Resistances acid, fire, lightning, thunder; bludgeoning, piercing and slashing from nonmagical attacks\nDamage Immunities cold, necrotic, poison\nCondition Immunities charmed, exhaustion, frightened, grappled, paralyzed, petrified, poisoned, prone, restrained\nSenses darkvision 60 ft., passive Perception 10\nLanguages Common, Elvish\nChallenge 4 (1,100 XP) | Proficiency Bonus +2\n\nTRAITS\nDetect Life. Can magically sense creatures up to 5 miles away that aren't undead or constructs. Knows the general direction but not exact locations.\nIncorporeal Movement. Can move through creatures and objects as if difficult terrain. Takes 5 (1d10) force damage if it ends its turn inside an object.\n\nACTIONS\nCorrupting Touch. Melee Spell Attack: +4 to hit, reach 5 ft., one target. Hit: 12 (3d6 + 2) necrotic damage.\nHorrifying Visage. Each non-undead creature within 60 ft. that can see her must succeed on a DC 13 WIS save or be frightened for 1 minute. A frightened target repeats the save at the end of each of its turns, with disadvantage if the banshee is in line of sight, ending the effect on itself on a success. On a success (or when the effect ends) the target is immune to this banshee's Horrifying Visage for 24 hours.\nWail (1/Day). Not usable in sunlight. No effect on constructs and undead. All other creatures within 30 ft. that can hear her must make a DC 13 CON save. On a failure, drops to 0 hit points. On a success, takes 10 (3d6) psychic damage."],
["Revenant","Argynvostholt","AC 13, HP 136, CR 5","Medium undead, neutral\nAC 13 (leather armor) | HP 136 (16d8 + 64) | Speed 30 ft.\nSTR 18 (+4) DEX 14 (+2) CON 18 (+4) INT 13 (+1) WIS 16 (+3) CHA 18 (+4)\nSaving Throws STR +7, CON +7, WIS +6, CHA +7\nDamage Resistances necrotic, psychic\nDamage Immunities poison\nCondition Immunities charmed, exhaustion, frightened, paralyzed, poisoned, stunned\nSenses darkvision 60 ft., passive Perception 13\nLanguages the languages it knew in life\nChallenge 5 (1,800 XP) | Proficiency Bonus +3\n\nTRAITS\nRegeneration. Regains 10 hit points at the start of its turn. If it takes fire or radiant damage, this trait doesn't function at the start of its next turn. Its body is destroyed only if it starts its turn with 0 hit points and doesn't regenerate.\nRejuvenation. When its body is destroyed, its soul lingers. After 24 hours, the soul inhabits and animates another humanoid corpse on the same plane of existence and regains all its hit points. While the soul is bodiless, a wish spell can be used to force the soul to go to the afterlife and not return.\nTurn Immunity. Immune to effects that turn undead.\nVengeful Tracker. Knows the distance to and direction of any creature against which it seeks revenge, even if the creature and the revenant are on different planes of existence. If the creature being tracked dies, the revenant knows.\n\nACTIONS\nMultiattack. Two fist attacks.\nFist. Melee Weapon Attack: +7 to hit, reach 5 ft., one target. Hit: 11 (2d6 + 4) bludgeoning damage. If the target is a creature against which the revenant has sworn vengeance, it takes an extra 14 (4d6) bludgeoning damage. Instead of dealing damage, the revenant can grapple the target (escape DC 14) provided the target is Large or smaller.\nVengeful Glare. Targets one creature it can see within 30 ft. against which it has sworn vengeance. The target must make a DC 15 WIS save. On a failure, the target is paralyzed until the revenant deals damage to it, or until the end of the revenant's next turn. When the paralysis ends, the target is frightened of the revenant for 1 minute. The frightened target can repeat the save at the end of each of its turns, with disadvantage if it can see the revenant, ending the frightened condition on itself on a success."],
["Flameskull","Roaming / Other","AC 13, HP 40, CR 4","Tiny undead, neutral evil\nAC 13 | HP 40 (9d4 + 18) | Speed 0 ft., fly 40 ft. (hover)\nSTR 1 (-5) DEX 17 (+3) CON 14 (+2) INT 16 (+3) WIS 10 (+0) CHA 11 (+0)\nSkills Arcana +5, Perception +2\nDamage Resistances lightning, necrotic, piercing\nDamage Immunities cold, fire, poison\nCondition Immunities charmed, frightened, paralyzed, poisoned, prone\nSenses darkvision 60 ft., passive Perception 12\nLanguages Common\nChallenge 4 (1,100 XP) | Proficiency Bonus +2\n\nTRAITS\nIllumination. Sheds either dim light in a 15-foot radius, or bright light in a 15-foot radius and dim light for an additional 15 feet. It can switch between the options as an action.\nMagic Resistance. Advantage on saving throws against spells and other magical effects.\nRejuvenation. If destroyed, it regains all its hit points in 1 hour unless holy water is sprinkled on its remains or a dispel magic or remove curse spell is cast on them.\nSpellcasting. 5th-level spellcaster. Spellcasting ability INT (spell save DC 13, +5 to hit with spell attacks). Requires no somatic or material components. Wizard spells prepared:\n- Cantrip (at will): mage hand\n- 1st level (3 slots): magic missile, shield\n- 2nd level (2 slots): blur, flaming sphere\n- 3rd level (1 slot): fireball\n\nACTIONS\nMultiattack. Uses Fire Ray twice.\nFire Ray. Ranged Spell Attack: +5 to hit, range 30 ft., one target. Hit: 10 (3d6) fire damage."],
["Will-o'-wisp","Roaming / Other","AC 19, HP 22, CR 2","Tiny undead, chaotic evil\nAC 19 | HP 22 (9d4) | Speed 0 ft., fly 50 ft. (hover)\nSTR 1 (-5) DEX 28 (+9) CON 10 (+0) INT 13 (+1) WIS 14 (+2) CHA 11 (+0)\nDamage Resistances acid, cold, fire, necrotic, thunder; bludgeoning, piercing and slashing from nonmagical attacks\nDamage Immunities lightning, poison\nCondition Immunities exhaustion, grappled, paralyzed, poisoned, prone, restrained, unconscious\nSenses darkvision 120 ft., passive Perception 12\nLanguages the languages it knew in life\nChallenge 2 (450 XP)\n\nTRAITS\nConsume Life. As a bonus action, targets one creature it can see within 5 ft. that has 0 HP and is still alive. The target must succeed on a DC 10 CON save or die. If it dies, the wisp regains 10 (3d6) hit points.\nEphemeral. Can't wear or carry anything.\nIncorporeal Movement. Can move through creatures and objects as if difficult terrain. Takes 5 (1d10) force damage if it ends its turn inside an object.\nVariable Illumination. Sheds bright light in a 5- to 20-foot radius and dim light for an additional number of feet equal to the chosen radius. Can alter the radius as a bonus action.\n\nACTIONS\nShock. Melee Spell Attack: +4 to hit, reach 5 ft., one creature. Hit: 9 (2d8) lightning damage.\nInvisibility. The wisp and its light magically become invisible until it attacks or uses Consume Life, or until its concentration ends (as if concentrating on a spell)."],
["Scarecrow","Roaming / Other","AC 11, HP 36, CR 1","Medium construct, chaotic evil\nAC 11 | HP 36 (8d8) | Speed 30 ft.\nSTR 11 (+0) DEX 13 (+1) CON 11 (+0) INT 10 (+0) WIS 10 (+0) CHA 13 (+1)\nDamage Vulnerabilities fire\nDamage Resistances bludgeoning, piercing and slashing from nonmagical attacks\nDamage Immunities poison\nCondition Immunities charmed, exhaustion, frightened, paralyzed, poisoned, unconscious\nSenses darkvision 60 ft., passive Perception 10\nLanguages understands the languages of its creator but can't speak\nChallenge 1 (200 XP) | Proficiency Bonus +2\n\nTRAITS\nFalse Appearance. While motionless, it is indistinguishable from an ordinary, inanimate scarecrow.\n\nACTIONS\nMultiattack. Two claw attacks.\nClaw. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 6 (2d4 + 1) slashing damage. If the target is a creature, it must succeed on a DC 11 WIS save or be frightened until the end of the scarecrow's next turn.\nTerrifying Glare. Targets one creature within 30 ft. that can see it. The target must succeed on a DC 11 WIS save or be magically frightened until the end of the scarecrow's next turn. The frightened target is paralyzed."],
["Needle blight","Roaming / Other","AC 12, HP 11, CR 1/4","Medium plant, neutral evil\nAC 12 (natural armor) | HP 11 (2d8 + 2) | Speed 30 ft.\nSTR 12 (+1) DEX 12 (+1) CON 13 (+1) INT 4 (-3) WIS 8 (-1) CHA 3 (-4)\nCondition Immunities blinded, deafened\nSenses blindsight 60 ft. (blind beyond this radius), passive Perception 9\nLanguages understands Common but can't speak\nChallenge 1/4 (50 XP) | Proficiency Bonus +2\n\nACTIONS\nClaws. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 6 (2d4 + 1) piercing damage.\nNeedles. Ranged Weapon Attack: +3 to hit, range 30/60 ft., one target. Hit: 8 (2d6 + 1) piercing damage."],
["Twig blight","Roaming / Other","AC 13, HP 4, CR 1/8","Small plant, neutral evil\nAC 13 (natural armor) | HP 4 (1d6 + 1) | Speed 20 ft.\nSTR 6 (-2) DEX 13 (+1) CON 12 (+1) INT 4 (-3) WIS 8 (-1) CHA 3 (-4)\nSkills Stealth +3\nDamage Vulnerabilities fire\nCondition Immunities blinded, deafened\nSenses blindsight 60 ft. (blind beyond this radius), passive Perception 9\nLanguages understands Common but can't speak\nChallenge 1/8 (25 XP) | Proficiency Bonus +2\n\nTRAITS\nFalse Appearance. While motionless, it is indistinguishable from a dead shrub.\n\nACTIONS\nClaws. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 3 (1d4 + 1) piercing damage."],
["Vine blight","Roaming / Other","AC 12, HP 26, CR 1/2","Medium plant, neutral evil\nAC 12 (natural armor) | HP 26 (4d8 + 8) | Speed 10 ft.\nSTR 15 (+2) DEX 8 (-1) CON 14 (+2) INT 5 (-3) WIS 10 (+0) CHA 3 (-4)\nSkills Stealth +1\nCondition Immunities blinded, deafened\nSenses blindsight 60 ft. (blind beyond this radius), passive Perception 10\nLanguages Common\nChallenge 1/2 (100 XP) | Proficiency Bonus +2\n\nTRAITS\nFalse Appearance. While motionless, it is indistinguishable from a tangle of vines.\n\nACTIONS\nConstrict. Melee Weapon Attack: +4 to hit, reach 10 ft., one target. Hit: 9 (2d6 + 2) bludgeoning damage, and a Large or smaller target is grappled (escape DC 12). Until this grapple ends, the target is restrained, and the blight can't constrict another target.\nEntangling Plants (Recharge 5-6). Grasping roots and vines sprout in a 15-foot radius centered on the blight, withering away after 1 minute. For the duration, that area is difficult terrain for nonplant creatures. In addition, each creature of the blight's choice in that area when the plants appear must succeed on a DC 12 STR save or become restrained. A creature can use its action to make a DC 12 STR check, freeing itself or another entangled creature within reach on a success."],
["Druid","Yester Hill","AC 11 (16 with barkskin), HP 27, CR 2","Medium humanoid (any race), any alignment\nAC 11 (16 with barkskin) | HP 27 (5d8 + 5) | Speed 30 ft.\nSTR 10 (+0) DEX 12 (+1) CON 13 (+1) INT 12 (+1) WIS 15 (+2) CHA 11 (+0)\nSkills Medicine +4, Nature +3, Perception +4\nSenses passive Perception 14\nLanguages Druidic plus any two languages\nChallenge 2 (450 XP)\n\nTRAITS\nSpellcasting. 4th-level spellcaster. Spellcasting ability WIS (spell save DC 12, +4 to hit with spell attacks). Prepared:\n- Cantrips (at will): druidcraft, produce flame, shillelagh\n- 1st level (4 slots): entangle, longstrider, speak with animals, thunderwave\n- 2nd level (3 slots): animal messenger, barkskin\n\nACTIONS\nQuarterstaff. Melee Weapon Attack: +2 to hit (+4 with shillelagh), reach 5 ft., one target. Hit: 3 (1d6) bludgeoning damage, 4 (1d8) if used with two hands, or 6 (1d8 + 2) with shillelagh."],
["Berserker","Roaming / Other","AC 13, HP 67, CR 2","Medium humanoid (any race), any chaotic alignment\nAC 13 (hide armor) | HP 67 (9d8 + 27) | Speed 30 ft.\nSTR 16 (+3) DEX 12 (+1) CON 17 (+3) INT 9 (-1) WIS 11 (+0) CHA 9 (-1)\nSenses passive Perception 10\nLanguages any one language (usually Common)\nChallenge 2 (450 XP)\n\nTRAITS\nReckless. At the start of its turn, it can gain advantage on all melee weapon attack rolls during that turn, but attack rolls against it have advantage until the start of its next turn.\n\nACTIONS\nGreataxe. Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 9 (1d12 + 3) slashing damage."],
["Ghost", "Roaming / Other", "AC 11, HP 45, CR 4", "Medium undead, any alignment\nAC 11 | HP 45 (10d8) | Speed 0 ft., fly 40 ft. (hover)\nSTR 7 (-2) DEX 13 (+1) CON 10 (+0) INT 10 (+0) WIS 12 (+1) CHA 17 (+3)\nDamage Resistances acid, fire, lightning, thunder; bludgeoning, piercing and slashing from nonmagical attacks\nDamage Immunities cold, necrotic, poison\nCondition Immunities charmed, exhaustion, frightened, grappled, paralyzed, petrified, poisoned, prone, restrained\nSenses darkvision 60 ft., passive Perception 11\nLanguages any languages it knew in life\nChallenge 4 (1,100 XP) | Proficiency Bonus +2\n\nTRAITS\nEthereal Sight. Can see 60 ft. into the Ethereal Plane when it is on the Material Plane, and vice versa.\nIncorporeal Movement. Can move through creatures and objects as if difficult terrain. Takes 5 (1d10) force damage if it ends its turn inside an object.\n\nACTIONS\nWithering Touch. Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 17 (4d6 + 3) necrotic damage.\nEtherealness. Enters the Ethereal Plane from the Material Plane, or vice versa. It is visible on the Material Plane while in the Border Ethereal, and vice versa, yet can't affect or be affected by anything on the other plane.\nHorrifying Visage. Each non-undead creature within 60 ft. that can see it must succeed on a DC 13 WIS save or be frightened for 1 minute. If the save fails by 5 or more, the target also ages 1d4 x 10 years. A frightened target can repeat the save at the end of each of its turns, ending the frightened condition on itself on a success. If a target's save is successful or the effect ends for it, it is immune to this ghost's Horrifying Visage for 24 hours. The aging effect can be reversed with a greater restoration spell, but only within 24 hours of it occurring.\nPossession (Recharge 6). One humanoid within 5 ft. must succeed on a DC 13 CHA save or be possessed; the ghost then disappears, and the target is incapacitated and loses control of its body. The ghost now controls the body but doesn't deprive the target of awareness. The ghost can't be targeted by any attack, spell or other effect, except ones that turn undead, and it retains its alignment, INT, WIS, CHA and immunity to being charmed and frightened. It otherwise uses the possessed target's statistics, but doesn't gain access to the target's knowledge, class features or proficiencies.\nThe possession lasts until the body drops to 0 hit points, the ghost ends it as a bonus action, or the ghost is turned or forced out by an effect like dispel evil and good. When the possession ends, the ghost reappears in an unoccupied space within 5 ft. of the body. The target is immune to this ghost's Possession for 24 hours after succeeding on the save or after the possession ends."],
  ["Strahd zombie", "Castle Ravenloft", "AC 8, HP 30, CR 1", "Medium undead, unaligned\nAC 8 | HP 30 (4d8 + 12) | Speed 20 ft.\nSTR 13 (+1) DEX 6 (-2) CON 16 (+3) INT 3 (-4) WIS 6 (-2) CHA 5 (-3)\nSaving Throws WIS +0\nDamage Immunities poison | Condition Immunities poisoned\nSenses darkvision 60 ft., passive Perception 8\nLanguages understands the languages it knew in life but can't speak\nChallenge 1 (200 XP) | Proficiency Bonus +2\n\nTRAITS\nLoathsome Limbs. Whenever the zombie takes at least 5 bludgeoning or slashing damage at one time, roll a d20 to determine what else happens to it:\n- 1-8: One leg is severed if it has any legs left.\n- 9-16: One arm is severed if it has any arms left.\n- 17-20: The zombie is decapitated.\nIf the zombie is reduced to 0 hit points, all parts of it die. Until then, a severed part acts on the zombie's initiative and has its own action and movement. A severed part has AC 8. Any damage it takes is subtracted from the zombie's hit points.\nA severed leg is unable to attack and has a speed of 5 feet.\nA severed arm has a speed of 5 feet and can make one claw attack on its turn, with disadvantage on the attack roll. Each time the zombie loses an arm, it loses a claw attack.\nIf its head is severed, the zombie loses its bite attack and its body is blinded unless the head can see it. The severed head has a speed of 0 feet. It can make a bite attack, but only against a target in its space.\nThe zombie's speed is halved if it's missing a leg. If it loses both legs, it falls prone. If it has both arms, it can crawl. With only one arm, it can still crawl, but its speed is halved. With no arms or legs, its speed is 0 feet, and it can't benefit from bonuses to speed.\nUndead Nature. Doesn't require air or sleep.\n\nACTIONS\nMultiattack. Three attacks: one with its bite and two with its claws.\nBite. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 3 (1d4 + 1) piercing damage.\nClaw. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d6 + 1) slashing damage."],
  ["Commoner", "Roaming / Other", "AC 10, HP 4, CR 0", "Medium humanoid (any race), any alignment\nAC 10 | HP 4 (1d8) | Speed 30 ft.\nSTR 10 (+0) DEX 10 (+0) CON 10 (+0) INT 10 (+0) WIS 10 (+0) CHA 10 (+0)\nSenses passive Perception 10\nLanguages any one language (usually Common)\nChallenge 0 (10 XP) | Proficiency Bonus +2\n\nACTIONS\nClub. Melee Weapon Attack: +2 to hit, reach 5 ft., one target. Hit: 2 (1d4) bludgeoning damage."],
  ["Scout", "Roaming / Other", "AC 13, HP 16, CR 1/2", "Medium humanoid (any race), any alignment\nAC 13 (leather armor) | HP 16 (3d8 + 3) | Speed 30 ft.\nSTR 11 (+0) DEX 14 (+2) CON 12 (+1) INT 11 (+0) WIS 13 (+1) CHA 11 (+0)\nSkills Nature +4, Perception +5, Stealth +6, Survival +5\nSenses passive Perception 15\nLanguages any one language (usually Common)\nChallenge 1/2 (100 XP) | Proficiency Bonus +2\n\nTRAITS\nKeen Hearing and Sight. Advantage on WIS (Perception) checks that rely on hearing or sight.\n\nACTIONS\nMultiattack. Two melee attacks or two ranged attacks.\nShortsword. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) piercing damage.\nLongbow. Ranged Weapon Attack: +4 to hit, range 150/600 ft., one target. Hit: 6 (1d8 + 2) piercing damage."],
  ["Bandit", "Roaming / Other", "AC 12, HP 11, CR 1/8", "Medium humanoid (any race), any non-lawful alignment\nAC 12 (leather armor) | HP 11 (2d8 + 2) | Speed 30 ft.\nSTR 11 (+0) DEX 12 (+1) CON 12 (+1) INT 10 (+0) WIS 10 (+0) CHA 10 (+0)\nSenses passive Perception 10\nLanguages any one language (usually Common)\nChallenge 1/8 (25 XP) | Proficiency Bonus +2\n\nACTIONS\nScimitar. Melee Weapon Attack: +3 to hit, reach 5 ft., one target. Hit: 4 (1d6 + 1) slashing damage.\nLight Crossbow. Ranged Weapon Attack: +3 to hit, range 80/320 ft., one target. Hit: 5 (1d8 + 1) piercing damage."],
["Tree blight", "Roaming / Other", "AC 15, HP 92, CR 7", "Huge plant, typically neutral evil\nAC 15 (natural armor) | HP 92 (8d12 + 40) | Speed 30 ft.\nSTR 23 (+6) DEX 10 (+0) CON 20 (+5) INT 6 (-2) WIS 10 (+0) CHA 3 (-4)\nCondition Immunities blinded, deafened\nSenses blindsight 60 ft. (blind beyond this radius), passive Perception 10\nLanguages understands Common and Druidic but doesn't speak\nChallenge 7 (2,900 XP) | Proficiency Bonus +3\n\nTRAITS\nFalse Appearance. If motionless at the start of combat, it has advantage on its initiative roll. Moreover, if a creature hasn't observed the blight move or act, that creature must succeed on a DC 18 INT (Investigation) check to discern that the blight is animate.\nSiege Monster. Deals double damage to objects and structures.\n\nACTIONS\nMultiattack. One Branch attack and one Grasping Root attack.\nBranch. Melee Weapon Attack: +9 to hit, reach 15 ft., one target. Hit: 16 (3d6 + 6) bludgeoning damage.\nGrasping Root. Melee Weapon Attack: +9 to hit, reach 15 ft., one creature not grappled by the blight. Hit: The target is grappled (escape DC 15). Until the grapple ends, the target takes 9 (1d6 + 6) bludgeoning damage at the start of each of its turns. The root has AC 15 and can be severed by dealing 6 or more slashing damage to it in one attack. Cutting the root doesn't hurt the blight but ends the grapple.\n\nBONUS ACTIONS\nBite. Melee Weapon Attack: +9 to hit, reach 5 ft., one creature grappled by the blight. Hit: 19 (3d8 + 6) piercing damage."],
["Strahd von Zarovich","Castle Ravenloft","AC 16, HP 144, CR 15","Medium undead, lawful evil\nAC 16 (natural armor) | HP 144 (17d8 + 68) | Speed 30 ft.\nSTR 18 (+4) DEX 18 (+4) CON 18 (+4) INT 20 (+5) WIS 15 (+2) CHA 18 (+4)\nSaving Throws DEX +9, WIS +7, CHA +9\nSkills Arcana +15, Perception +12, Religion +10, Stealth +14\nDamage Resistances necrotic; bludgeoning, piercing and slashing from nonmagical attacks\nSenses darkvision 120 ft., passive Perception 22\nLanguages Abyssal, Common, Draconic, Elvish, Giant, Infernal\nChallenge 15 (13,000 XP) | Proficiency Bonus +5\n\nTRAITS\nShapechanger. If not in running water or sunlight, he can use his action to polymorph into a Tiny bat, a Medium wolf or a Medium cloud of mist, or back into his true form.\n While in bat or wolf form, he can't speak. Bat form: walking speed 5 ft., flying speed 30 ft. Wolf form: walking speed 40 ft. His statistics, other than size and speed, are unchanged. Anything he is wearing transforms with him, but nothing he is carrying does. He reverts to his true form if he dies.\n While in mist form, he can't take any actions, speak or manipulate objects. He is weightless, has a flying speed of 20 ft., can hover, and can enter a hostile creature's space and stop there. If air can pass through a space, the mist can do so without squeezing, and he can't pass through water. He has advantage on STR, DEX and CON saving throws, and is immune to all nonmagical damage, except the damage he takes from sunlight.\nLegendary Resistance (3/Day). If he fails a saving throw, he can choose to succeed instead.\nMisty Escape. When he drops to 0 hit points outside his coffin, he transforms into a cloud of mist (as in the Shapechanger trait) instead of falling unconscious, provided he isn't in running water or sunlight. If he can't transform, he is destroyed.\n While he has 0 hit points in mist form, he can't revert to his vampire form, and he must reach his coffin within 2 hours or be destroyed. Once in his coffin, he reverts to his vampire form. He is then paralyzed until he regains at least 1 hit point. After 1 hour in his coffin with 0 hit points, he regains 1 hit point.\nRegeneration. Regains 20 hit points at the start of his turn if he has at least 1 hit point and isn't in running water or sunlight. If he takes radiant damage or damage from holy water, this trait doesn't function at the start of his next turn.\nSpellcasting. 9th-level spellcaster. Spellcasting ability INT (spell save DC 18, +10 to hit with spell attacks). Wizard spells prepared:\n- Cantrips (at will): mage hand, prestidigitation, ray of frost\n- 1st level (4 slots): comprehend languages, fog cloud, sleep\n- 2nd level (3 slots): detect thoughts, gust of wind, mirror image\n- 3rd level (3 slots): animate dead, fireball, nondetection\n- 4th level (3 slots): blight, greater invisibility, polymorph\n- 5th level (1 slot): animate objects, scrying\nSpider Climb. Can climb difficult surfaces, including upside down on ceilings, without an ability check.\nVampire Weaknesses.\n- Forbiddance: can't enter a residence without an invitation from one of the occupants.\n- Harmed by Running Water: takes 20 acid damage if he ends his turn in running water.\n- Stake to the Heart: if a piercing weapon made of wood is driven into his heart while he is incapacitated in his coffin, he is paralyzed until the stake is removed.\n- Sunlight Hypersensitivity: while in sunlight, takes 20 radiant damage at the start of his turn, and has disadvantage on attack rolls and ability checks.\n\nACTIONS\nMultiattack (Vampire Form Only). Two attacks, only one of which can be a bite attack.\nUnarmed Strike (Vampire or Wolf Form Only). Melee Weapon Attack: +9 to hit, reach 5 ft., one target. Hit: 8 (1d8 + 4) slashing damage plus 14 (4d6) necrotic damage. If the target is a creature, Strahd can grapple it (escape DC 18) instead of dealing the slashing damage.\nBite. Melee Weapon Attack: +9 to hit, reach 5 ft., one willing creature, or a creature that is grappled by Strahd, incapacitated or restrained. Hit: 7 (1d6 + 4) piercing damage plus 10 (3d6) necrotic damage. The target's hit point maximum is reduced by the necrotic damage taken, and Strahd regains hit points equal to that amount. The reduction lasts until the target finishes a long rest. The target dies if its hit point maximum is reduced to 0. A humanoid slain in this way and then buried in the ground rises the following night as a vampire spawn under Strahd's control.\nCharm. Targets one humanoid he can see within 30 ft. If the target can see Strahd, it must succeed on a DC 17 WIS save or be charmed. The charmed target regards Strahd as a trusted friend to be heeded and protected. The target isn't under Strahd's control, but it takes Strahd's requests and actions in the most favorable way and lets Strahd bite it. Each time Strahd or his companions do anything harmful to the target, it can repeat the save, ending the effect on itself on a success. Otherwise, the effect lasts 24 hours or until Strahd is destroyed, is on a different plane of existence than the target, or takes a bonus action to end the effect.\nChildren of the Night (1/Day). Magically calls 2d4 swarms of bats or swarms of rats, provided the sun isn't up. While outdoors, he can call 3d6 wolves instead. The called creatures arrive in 1d4 rounds, acting as allies of Strahd and obeying his spoken commands. The beasts remain for 1 hour, until Strahd dies, or until he dismisses them as a bonus action.\n\nLEGENDARY ACTIONS\nStrahd can take 3 legendary actions, choosing from the options below. Only one can be used at a time and only at the end of another creature's turn. He regains spent legendary actions at the start of his turn.\nMove. Moves up to his speed without provoking opportunity attacks.\nUnarmed Strike. Makes one unarmed strike.\nBite (Costs 2 Actions). Makes one bite attack.\n\nHEART OF SORROW\nAny damage Strahd takes is transferred to the Heart of Sorrow (Castle Ravenloft, area K20). If the heart absorbs damage that reduces it to 0 hit points, it is destroyed, and Strahd takes any leftover damage. The Heart of Sorrow has 50 hit points and is restored to that number each dawn, provided it has at least 1 hit point remaining. As a bonus action on his turn, Strahd can break his link to the Heart so it no longer absorbs damage dealt to him. He can reestablish the link as a bonus action on his turn, but only while in Castle Ravenloft. The Heart's ability to absorb damage is suppressed if it or Strahd is fully within an antimagic field.\n\nLAIR ACTIONS\nWhile in Castle Ravenloft, Strahd can take lair actions as long as he isn't incapacitated. On initiative count 20 (losing initiative ties), he can take one of the following options, or forgo using any of them in that round:\n- Until initiative count 20 of the next round, Strahd can pass through solid walls, doors, ceilings and floors as if they weren't there.\n- Strahd targets any number of doors and windows he can see, causing each one to open or close as he wishes. Closed doors can be magically locked (needing a successful DC 20 STR check to force open) until Strahd chooses to end the effect, or until he uses this lair action again.\n- Strahd summons the angry spirit of one who has died in the castle. The apparition appears next to a hostile creature that Strahd can see, makes an attack against that creature, and then disappears. The apparition has the statistics of a specter.\n- Strahd targets one Medium or smaller creature that casts a shadow. The target's shadow must be visible to Strahd and within 30 feet of him. If the target fails a DC 17 CHA save, its shadow detaches from it and becomes a shadow that obeys Strahd's commands, acting on initiative count 20. A greater restoration or remove curse spell cast on the target restores its natural shadow, but only if its undead shadow has been destroyed.\n\nTACTICS\n- Strahd attacks at the most advantageous moment and from the most advantageous position.\n- He knows when he's in over his head. If he begins taking more damage than he can regenerate, he moves beyond the reach of melee combatants and spellcasters, or flies away (using summoned wolves or swarms of bats or rats to guard his retreat).\n- He observes the characters to see who is most easily swayed, then tries to charm characters with low WIS scores and use them as thralls. At the very least, he can order a charmed character to guard him against other party members.\n- He can be encountered almost anywhere in his domain, but is always encountered in the place indicated by the Tarokka card reading, unless he has been forced into his tomb in the catacombs of Castle Ravenloft.\n\nSTRAHD'S MINIONS (when he appears somewhere other than his tomb or the card-reading location, roll d20)\n1-3: 1d4 + 2 dire wolves\n4-6: 1d6 + 3 ghouls\n7-9: 1d4 + 2 Strahd zombies\n10-12: 2d4 swarms of bats\n13-15: 1d4 + 1 vampire spawn\n16-18: 3d6 wolves\n19-20: none"]
];

var NPCINFO={
"Strahd von Zarovich":"Tactics: attacks from the best position and withdraws, with wolves or bats covering him, once damage outpaces his regeneration. Tries to charm low-Wisdom characters into guarding him. Appears where the Tarokka reading says.",
"Baba Lysaga":"Strahd's old midwife, exiled by his mother Queen Ravenovia, who thinks of herself as his true mother. Devoted to Mother Night and never confronts Strahd. At war with the Keepers of the Feather and the Wizard of Wines; wants all his enemies destroyed.",
"Madam Eva":"Secretly Katarina, Strahd's half-sister (he does not know). Once a maid in Castle Ravenloft. Wants Strahd freed from his curse and counts the Vistani as her people. Sees those she reads for as a means to an end.",
"Rahadin":"Dusk elf chamberlain, loyal to Strahd above everything; his own bond names him a son of King Barov. On Strahd's orders he killed the female dusk elves and cut off Kasimir's ears. Anyone within 10 ft hears the screams of his victims.",
"Pidlwick II":"Clockwork copy of a court fool; it pushed the real Pidlwick down the stairs and used to smother guests. Lonely and wants a friend, but does bad things when upset. Fears Strahd.",
"Izek Strazni":"Born without a soul; lost an arm to a dire wolf as a child and grew a fiendish one. Dreams of a woman (Ireena) and has Gadof Blinsky make dolls of her. He is Ireena's brother; neither knows. Loyal to the baron out of debt, not family.",
"Rictavio (Rudolph van Richten)":"Rudolph van Richten in disguise, a vampire hunter who came to kill Strahd. Works alone because a curse dooms his friends. Does not know Ezmerelda is in Barovia. Retreats to his tower if exposed.",
"Ezmerelda d'Avenir":"Vistana vampire hunter and van Richten's former protegee; her family once kidnapped his son. Searching for him. Lost her right leg below the knee to a werewolf (prosthetic). Keeps a tarokka deck in her wagon and can give a card reading. Reckless.",
"Kasimir Velikov":"Dusk elf leader, mutilated by Rahadin. His sister Patrina lies in the castle catacombs and speaks to him in dreams. Wants the party's help at the Amber Temple to bring her back; Patrina is using him to become a powerful vampire.",
"Vladimir Horngaard":"Leader of the revenant knights. Hates Strahd but wants him to suffer, not rest. If he let go of his hatred he and his knights could find peace; Strahd's defeat would lift the mists and free them.",
"The Abbot":"A deva who fell from grace after helping the Belviews. Created the mongrelfolk and flesh golems, and is building Vasilka as a bride for Strahd, who is not interested. Believes his own heart is pure.",
"Arabelle":"Descendant of Madam Eva with Barovian royal blood; unaware of any link to Strahd. Seven years old but acts like an adult and believes she has a great destiny. If rescued she insists on being returned to the Vallaki camp and says Luvash will reward the party."
};

  if(!drag)return;
  var d=drag;drag=null;
  d.rl.insertBefore(d.card,d.ph);d.ph.parentNode.removeChild(d.ph);
  d.card.classList.remove("drag");d.card.style.width="";d.card.style.left="";d.card.style.top="";
  var ids=[].slice.call(d.rl.children).filter(function(c){return c.dataset.rid}).map(function(c){return c.dataset.rid});
  var m={};S.quests.forEach(function(q){m[q.id]=q});
  var out=ids.map(function(id){return m[id]}).filter(Boolean);
  S.quests.forEach(function(q){if(out.indexOf(q)<0)out.push(q)});
  S.quests=out;save();render()}
 document.addEventListener("pointerdown",function(e){
  var g=e.target.closest&&e.target.closest(".grip");if(!g||!ui.rearr||drag)return;
  var card=g.closest(".rcard"),rl=document.getElementById("rl");if(!card||!rl)return;
  e.preventDefault();
  var r=card.getBoundingClientRect(),ph=document.createElement("div");
  ph.className="rph";ph.style.height=r.height+"px";rl.insertBefore(ph,card);
  card.classList.add("drag");card.style.width=r.width+"px";card.style.left=r.left+"px";card.style.top=r.top+"px";
  drag={card:card,ph:ph,rl:rl,dy:e.clientY-r.top,y:e.clientY};
  try{g.setPointerCapture(e.pointerId)}catch(x){}
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end);
  tick()});
 document.addEventListener("keydown",function(e){
  var g=e.target.closest&&e.target.closest(".grip");if(!g||!ui.rearr)return;
  var dir=e.key==="ArrowUp"?-1:e.key==="ArrowDown"?1:0;if(!dir)return;
  e.preventDefault();
  var id=g.closest(".rcard").dataset.rid,i=S.quests.findIndex(function(x){return x.id===id}),j=i+dir;
  if(i<0||j<0||j>=S.quests.length)return;
  var t=S.quests[i];S.quests[i]=S.quests[j];S.quests[j]=t;save();render();
  var ng=document.querySelector('.rcard[data-rid="'+id+'"] .grip');if(ng)ng.focus()});
})();
render();
